apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: agones-128tick-engine
  labels:
    app.kubernetes.io/name: agones-128tick-engine
spec:
  # replicas owned by the FleetAutoscaler; re-applying must not reset the Ready buffer
  scheduling: Packed
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agones-128tick-engine
    spec:
      container: game-server
      ports:
        - name: game
          portPolicy: Dynamic
          containerPort: 7777
          protocol: UDP
      health:
        disabled: false
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 3
      sdkServer:
        logLevel: Info
        grpcPort: 9357
        httpPort: 9358
      template:
        metadata:
          labels:
            app.kubernetes.io/name: agones-128tick-engine
            app.kubernetes.io/component: game-server
        spec:
          terminationGracePeriodSeconds: 15
          containers:
            - name: game-server
              image: ghcr.io/kdim67/agones-128tick-engine:0.1.0
              imagePullPolicy: IfNotPresent
              args: ["--agones", "--port", "7777", "--metrics-port", "9090", "--empty-grace", "60"]
              ports:
                # Pod-network only; Prometheus scrapes the pod IP, never a host port
                - name: metrics
                  containerPort: 9090
                  protocol: TCP
              # requests == limits; Guaranteed QoS for static CPU pinning also needs Helm agones.image.sdk request == limit
              resources:
                requests:
                  cpu: "1"
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 128Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
